name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh fzf bsdextrautils
      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install fzf coreutils
      - name: Check syntax and run regressions
        run: |
          zsh -n zsh-ssh.zsh
          ./test.sh
